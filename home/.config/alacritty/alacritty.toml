[general]
live_config_reload = true
import = [ "~/.config/alacritty/themes/nightfly-alacritty.toml" ]

[window]
dynamic_padding = true

[font]
size        = 11.0
normal      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold        = { family = "FiraCode Nerd Font Mono", style = "Bold"    }
italic      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold"    }

[keyboard]
bindings = [
  { key = "Equals", mods = "Super", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Super", action = "DecreaseFontSize" },
]
