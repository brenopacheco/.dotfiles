[general]
live_config_reload = true
import = [ "./nightfly-alacritty.toml" ]

[window]
dynamic_padding = true
#padding = { x = 0, y = 0 }

[font]
size        = 11.0
normal      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold        = { family = "FiraCode Nerd Font Mono", style = "Bold"    }
italic      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold"    }

[keyboard]
bindings = [
  { key = "Back", mods = "Control", chars = "\u001b[3;5~"  },
  { key = "1",    mods = "Control", chars = "\u001b[49;5u" },
  { key = "2",    mods = "Control", chars = "\u001b[50;5u" },
  { key = "3",    mods = "Control", chars = "\u001b[51;5u" },
  { key = "4",    mods = "Control", chars = "\u001b[52;5u" },
  { key = "5",    mods = "Control", chars = "\u001b[53;5u" },
  { key = "6",    mods = "Control", chars = "\u001b[54;5u" },
  { key = "7",    mods = "Control", chars = "\u001b[55;5u" },
  { key = "8",    mods = "Control", chars = "\u001b[56;5u" },
  { key = "9",    mods = "Control", chars = "\u001b[57;5u" }
]
