# =============================================================================
#  .tmux.conf is read by tmux (server) on startup or with `tmux source-file`.
# =============================================================================

# ---------------------------------------------------------------------------
#  1.  Server behaviour  —  when does tmux decide to quit?
# ---------------------------------------------------------------------------

# Keep the tmux server alive even if no client is attached.
# Reason: you may want daemon‑like sessions (e.g. for scripts or re‑attach later).
set -s exit-unattached off

# Do NOT kill the server when the last session is closed.
# Reason: you can kill a session without losing the server, then start a new one.
set -g exit-empty off

# When a pane is destroyed, immediately renumber the remaining ones.
# Reason: avoids gaps in the window/pane index sequence.
set -g renumber-windows on

# How long (ms) status‑line messages stay visible.
set -g display-time 4000

# Time (ms) within which you can chain key bindings without pressing the prefix again.
# Reason: e.g. press prefix, then quickly hit `x`; no need to hit prefix again.
set -g repeat-time 300

# Let tmux update its internal clipboard so `copy-pipe` commands can send
# the selection to an external tool (xclip / wl‑copy).
# Requires `xclip` (X11) or `wl‑clipboard` (Wayland).
set -s set-clipboard on

# ---------------------------------------------------------------------------
#  2.  Sessions, windows & panes  —  numbering, history, naming
# ---------------------------------------------------------------------------

# Number windows and panes starting from 1 (more natural for fingers on a keyboard).
set -g base-index 1
set -g pane-base-index 1

# Scrollback lines per pane (how much you can scroll up with the mouse wheel or keys).
set -g history-limit 50000

# ---------------------------------------------------------------------------
#  3.  Terminal, colours & extended keys  —  the terminfo story
# ---------------------------------------------------------------------------
#  What is terminfo?
#  A database describing what a terminal can do (colours, key sequences, etc.).
#  tmux sits between your *outside* terminal (Alacritty) and the programs *inside*
#  its windows. It uses the outside terminfo to know what sequences it can send
#  to the display, and it tells inside programs what they can expect by setting
#  the `TERM` variable (controlled by `default-terminal`).
#
#  The name `tmux-256color` is a modern terminfo entry that supports 256 colours,
#  true colour (via the `Tc` extension), and other niceties. If it’s missing,
#  we fall back to `screen-256color`, which is always present but less featureful.
#
#  `terminal-features` tells tmux about capabilities the outside terminal has
#  that may NOT be in its own terminfo entry. Alacritty supports true colour (RGB)
#  and extended key sequences (CSI u), so we announce them here.
#
#  `extended-keys` enables tmux to parse and forward those extended key sequences
#  (e.g. Shift+arrows, Ctrl+arrows) so they work inside programs like Vim/Neovim.
# ---------------------------------------------------------------------------

# ----- default-terminal (inside view) ------------------------------------
# If the `tmux-256color` entry exists, use it; otherwise fall back to
# `screen-256color` and show a one‑time warning.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
} {
    set -g default-terminal "screen-256color"
    display-message "⚠️tmux-256color terminfo not found; using screen-256color"
}

# ----- terminal-features (outside view) ----------------------------------
# Tell tmux that Alacritty (and xterm‑256color, just in case) can do true colour.
set -as terminal-features 'alacritty:RGB'
set -as terminal-features 'xterm-256color:RGB'

# Tell tmux that Alacritty sends extended key sequences (CSI u).
set -as terminal-features 'alacritty:extkeys'

# NOTE: tell tmux Alacritty supports underline styles natively, avoiding
# software fallback rendering for curly/double/colored underlines.
set -as terminal-features 'alacritty:usstyle'

# ----- Extended keys support --------------------------------------------
# Enable tmux itself to understand extended key sequences.
set -s extended-keys on
# Tell tmux to forward those sequences to the programs inside the pane.
set -g extended-keys-format csi-u

# ----- Focus events ------------------------------------------------------
# NOTE: triggers a full screen redraw on focus change.  If you notice
# sluggishness when switching windows/tabs in neovim inside tmux, try
# setting this to `off` and see if it helps — at the cost of losing
# dim-on-unfocus borders.
set -g focus-events on

# ---------------------------------------------------------------------------
#  4.  Shell  —  what runs inside each new window/pane
# ---------------------------------------------------------------------------

# The shell tmux invokes for new windows/panes.
set -g default-shell "/usr/bin/fish"
set -g default-command "/usr/bin/fish"

# ---------------------------------------------------------------------------
#  5.  Key bindings & prefix  —  your personal command keys
# ---------------------------------------------------------------------------

# Use the Delete key as the prefix (instead of Ctrl‑b).
# If you ever wajt to go back, replace `Delete` with `C-b` below.
unbind C-b
set -g prefix Delete
# Pressing Delete twice sends a literal Delete to the application inside.
bind Delete send-prefix

# Kill the active pane without asking for confirmation.
bind-key x kill-pane

# Reload this configuration file and confirm with a message.
bind-key r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf reloaded"

# Launch a dmenu‑based session picker (assumes the script exists and dmenu is installed).
bind-key e run-shell "$HOME/bin/dmenu_session -o"

# ---------------------------------------------------------------------------
#  6.  Copy mode (vi‑style) & system clipboard
# ---------------------------------------------------------------------------

# Use Vi keys for navigating the scrollback buffer and selecting text.
set -g mode-keys vi

# Press `v` to start visual selection (like Vim’s visual mode).
bind -T copy-mode-vi v send-keys -X begin-selection

# Press `y` to yank (copy) the selection to the system clipboard.
# The command auto‑detects Wayland (`wl-copy`) or X11 (`xclip`).
# Install `wl-clipboard` on Wayland, `xclip` on X11.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "if [ -n \"$WAYLAND_DISPLAY\" ]; then wl-copy; else xclip -in -selection clipboard; fi"

# ---------------------------------------------------------------------------
#  7.  Mouse support  —  scroll, select, resize panes
# ---------------------------------------------------------------------------

# mouse option: wheel scrolls history, click switches panes/windows,
# drag resizes panes, and you can select text with the mouse. I doesn't
# play nice with terminal applications like vim.
set -g mouse off

# ---------------------------------------------------------------------------
